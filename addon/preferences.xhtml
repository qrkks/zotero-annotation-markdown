<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      onload="ZoteroAnnotationMarkdownPreferences.init(document)">
  <groupbox>
    <label><html:h2>Reader Annotations</html:h2></label>
    <checkbox id="annotation-markdown-enabled"
              preference="extensions.annotationMarkdown.enabled"
              label="Render annotation comments as Markdown"/>
    <checkbox id="annotation-markdown-math-enabled"
              preference="extensions.annotationMarkdown.mathEnabled"
              label="Render LaTeX math formulas"/>
    <checkbox id="annotation-markdown-paste-as-plain-text"
              preference="extensions.annotationMarkdown.pasteAsPlainText"
              label="Paste clipboard content into annotation comments as plain text"/>
    <description class="annotation-markdown-preference-description">Recommended when pasting responses from AI tools. Keeps Markdown editable and avoids importing rich-text formatting or hidden HTML.</description>
    <checkbox id="annotation-markdown-fast-editor"
              preference="extensions.annotationMarkdown.fastEditor"
              label="Use the fast annotation comment editor"/>
    <description class="annotation-markdown-preference-description">Helps reduce typing lag in documents with many annotations.</description>
  </groupbox>

  <groupbox>
    <label><html:h2>Rendering Performance</html:h2></label>
    <hbox class="annotation-markdown-preference-field" align="center">
      <label value="Annotation rendering"/>
      <menulist id="annotation-markdown-render-strategy"
        preference="extensions.annotationMarkdown.renderStrategy">
        <menupopup>
          <menuitem label="Automatic (recommended)" value="auto"/>
          <menuitem label="Render all annotations" value="eager"/>
          <menuitem label="Render near the viewport" value="lazy"/>
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Preview Font Size</html:h2></label>
    <hbox class="annotation-markdown-preference-field" align="center">
      <label value="Markdown preview font size"/>
      <menulist id="annotation-markdown-font-scale"
        preference="extensions.annotationMarkdown.fontScalePercent">
        <menupopup>
          <menuitem label="80%" value="80"/>
          <menuitem label="90%" value="90"/>
          <menuitem label="100%" value="100"/>
          <menuitem label="110%" value="110"/>
          <menuitem label="120%" value="120"/>
          <menuitem label="130%" value="130"/>
          <menuitem label="140%" value="140"/>
          <menuitem label="150%" value="150"/>
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>
</vbox>
