<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">印度尼西亚版 FACIT-COST 的验证研究</title>
  <desc id="desc">概括研究问题、设计、测量学方法、主要发现与结论的流程图。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .title { font-size: 23px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .card { stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="760" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" class="title">印度尼西亚版 FACIT-COST：测量学验证</text>

  <!-- 核心问题 -->
  <rect x="65" y="62" width="770" height="82" rx="14" fill="#eff6ff" stroke="#93c5fd" class="card"/>
  <text x="90" y="91" class="label" fill="#1d4ed8">核心问题</text>
  <text x="90" y="117" class="body">印度尼西亚版 FACIT-COST 能否有效、可靠地评估乳腺癌患者的主观经济毒性？</text>

  <path d="M450 144 L450 169" class="arrow"/>

  <!-- 研究设计 -->
  <rect x="65" y="176" width="770" height="88" rx="14" fill="#f0fdf4" stroke="#86efac" class="card"/>
  <text x="90" y="205" class="label" fill="#15803d">研究设计</text>
  <text x="90" y="231" class="body">单中心前瞻性队列；300 名乳腺癌女性患者；使用印度尼西亚版 FACIT-COST v2，随访最长 6 个月</text>
  <text x="90" y="251" class="small">评估分布特征、结构效度、内部一致性、已知组效度、重测信度与变化反应度</text>

  <path d="M450 264 L450 289" class="arrow"/>

  <!-- 方法 -->
  <rect x="65" y="296" width="770" height="151" rx="14" fill="#fff" stroke="#cbd5e1" class="card"/>
  <text x="90" y="325" class="label">测量学检验路径</text>

  <rect x="85" y="340" width="225" height="86" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="197" y="365" text-anchor="middle" class="body" font-weight="700">结构效度</text>
  <text x="197" y="389" text-anchor="middle" class="small">PCA + 平行分析</text>
  <text x="197" y="408" text-anchor="middle" class="small">再用 CFA 检验模型</text>

  <rect x="337" y="340" width="225" height="86" rx="10" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="449" y="365" text-anchor="middle" class="body" font-weight="700">信度</text>
  <text x="449" y="389" text-anchor="middle" class="small">Cronbach’s α、McDonald’s ω</text>
  <text x="449" y="408" text-anchor="middle" class="small">稳定者重测；变化者评估反应度</text>

  <rect x="589" y="340" width="225" height="86" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="701" y="365" text-anchor="middle" class="body" font-weight="700">效度与变化</text>
  <text x="701" y="389" text-anchor="middle" class="small">比较不同已知群体</text>
  <text x="701" y="408" text-anchor="middle" class="small">以 FT12 变化作为锚点</text>

  <path d="M450 447 L450 472" class="arrow"/>

  <!-- 关键发现 -->
  <rect x="65" y="479" width="770" height="176" rx="14" fill="#fff" stroke="#cbd5e1" class="card"/>
  <text x="90" y="508" class="label">关键证据</text>

  <circle cx="98" cy="535" r="4" fill="#7c3aed"/>
  <text x="112" y="540" class="body">结构：PCA 提出二因子结构；CFA 拟合良好（RMSEA = 0.042，SRMR = 0.049，CFI/TLI = 0.99）</text>

  <circle cx="98" cy="565" r="4" fill="#0284c7"/>
  <text x="112" y="570" class="body">内部一致性：α = 0.774–0.882；ω = 0.786–0.888；未见总分地板或天花板效应</text>

  <circle cx="98" cy="595" r="4" fill="#ea580c"/>
  <text x="112" y="600" class="body">已知组效度：总分可区分年龄、教育、居住地、收入、就业、转移状态、症状数及经济应对群体</text>

  <circle cx="98" cy="625" r="4" fill="#15803d"/>
  <text x="112" y="630" class="body">重测 ICC = 0.96；变化反应度指标范围 |0.39|–|0.92|</text>

  <path d="M450 655 L450 680" class="arrow"/>

  <!-- 结论 -->
  <rect x="65" y="687" width="770" height="58" rx="14" fill="#ecfdf5" stroke="#6ee7b7" class="card"/>
  <text x="90" y="713" class="label" fill="#047857">结论</text>
  <text x="173" y="713" class="body">印度尼西亚版 FACIT-COST 在该乳腺癌样本中表现出可接受的测量学性能，</text>
  <text x="173" y="734" class="body">可用于评估主观经济毒性，并为相关支持政策提供测量工具。</text>
</svg>
