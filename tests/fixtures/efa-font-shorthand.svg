<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="880" viewBox="0 0 1200 880">

  <title>探索性因素分析结果：PAF 与 Promax 斜交旋转</title>

  <rect width="1200" height="880" fill="#ffffff"/>

  <style>
    .heading {
      font: bold 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      fill: #17263b;
      text-anchor: middle;
    }
    .subhead {
      font: 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      fill: #334155;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .cell {
      font: 20px Georgia, "Times New Roman", serif;
      fill: #1e293b;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .item {
      font: 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      fill: #1e293b;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .note {
      font: 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      fill: #475569;
    }
    .english {
      font: 16px Georgia, "Times New Roman", serif;
      fill: #475569;
    }
    .gridline {
      stroke: #94a3b8;
      stroke-width: 1;
    }
  </style>

  <!-- ======================== -->
  <!-- 1. 成分矩阵（未旋转） -->
  <!-- ======================== -->

  <text x="198" y="40" class="heading">成分矩阵ᵃ</text>

  <rect x="28" y="70" width="340" height="298"
        fill="#f1f6ff" stroke="#64748b" stroke-width="1.5"/>

  <g class="gridline">
    <line x1="128" y1="70" x2="128" y2="368"/>
    <line x1="248" y1="112" x2="248" y2="368"/>
    <line x1="128" y1="112" x2="368" y2="112"/>
    <line x1="28" y1="146" x2="368" y2="146"/>
  </g>

  <text x="78" y="108" class="subhead">项目</text>
  <text x="248" y="91" class="subhead">成分</text>
  <text x="188" y="129" class="cell">1</text>
  <text x="308" y="129" class="cell">2</text>

  <g class="item">
    <text x="78" y="165">项目 6</text>
    <text x="78" y="202">项目 2</text>
    <text x="78" y="239">项目 5</text>
    <text x="78" y="276">项目 4</text>
    <text x="78" y="313">项目 1</text>
    <text x="78" y="350">项目 3</text>
  </g>

  <g class="cell">
    <text x="188" y="165">0.754</text>
    <text x="308" y="165">−0.457</text>

    <text x="188" y="202">0.667</text>
    <text x="308" y="202">0.536</text>

    <text x="188" y="239">0.620</text>
    <text x="308" y="239">−0.399</text>

    <text x="188" y="276">0.589</text>
    <text x="308" y="276">−0.339</text>

    <text x="188" y="313">0.561</text>
    <text x="308" y="313">0.417</text>

    <text x="188" y="350">0.513</text>
    <text x="308" y="350">0.391</text>
  </g>

  <text x="38" y="401" class="note">提取方法：</text>
  <text x="38" y="425" class="english">
    Principal Axis Factoring.
  </text>
  <text x="38" y="454" class="note">
    a. 提取 2 个因子需要 15 次迭代
  </text>

  <!-- ======================== -->
  <!-- 2. 旋转后成分矩阵（模式矩阵） -->
