  <!-- 4. 成分相关矩阵 -->
  <!-- ======================== -->

  <text x="600" y="573" class="heading">
    成分相关矩阵
  </text>

  <rect x="360" y="596" width="480" height="142"
        fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>

  <g class="gridline">
    <line x1="520" y1="596" x2="520" y2="738"/>
    <line x1="680" y1="596" x2="680" y2="738"/>
    <line x1="360" y1="643" x2="840" y2="643"/>
  </g>

  <g class="cell">
    <text x="440" y="619">Factor</text>
    <text x="600" y="619">1</text>
    <text x="760" y="619">2</text>

    <text x="440" y="669">1</text>
    <text x="600" y="669">1</text>
