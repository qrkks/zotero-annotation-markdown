    <text x="590" y="202">0.743</text>
    <text x="710" y="202">−0.017</text>

    <text x="590" y="239">0.672</text>
    <text x="710" y="239">−0.021</text>

    <text x="590" y="276">−0.015</text>
    <text x="710" y="276">0.861</text>

    <text x="590" y="313">0.016</text>
    <text x="710" y="313">0.694</text>

    <text x="590" y="350">0.007</text>
    <text x="710" y="350">0.642</text>
  </g>

  <text x="440" y="401" class="note">提取方法：</text>
  <text x="440" y="425" class="english">
    Principal Axis Factoring.
  </text>
  <text x="440" y="454" class="note">旋转方法：</text>
  <text x="440" y="478" class="english">
    Promax with Kaiser Normalization
  </text>
  <text x="440" y="506" class="note">
    b. 3 次迭代后收敛
  </text>

