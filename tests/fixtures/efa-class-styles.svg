<svg xmlns="http://www.w3.org/2000/svg"
     width="1120" height="1200"
     viewBox="0 0 1120 1200">

  <defs>
    <marker id="efa-arrow"
            markerWidth="9" markerHeight="9"
            refX="8" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z"
            fill="#64748b"/>
    </marker>
    <style>
      .bg { fill:#faf8f2; }
      .node {
        fill:#ffffff;
        stroke:#64748b;
        stroke-width:1.8;
      }
      .start {
        fill:#e8efff;
        stroke:#64748b;
        stroke-width:1.8;
      }
      .process {
        fill:#f0fdfa;
        stroke:#0f766e;
        stroke-width:1.8;
      }
      .result {
        fill:#ecfdf5;
        stroke:#059669;
        stroke-width:2;
      }
      .edge {
        fill:none;
        stroke:#64748b;
        stroke-width:2;
        stroke-linecap:round;
        stroke-linejoin:round;
        marker-end:url(#efa-arrow);
      }
      .return {
        fill:none;
        stroke:#b45309;
        stroke-width:1.8;
        stroke-dasharray:7 5;
        stroke-linecap:round;
        stroke-linejoin:round;
        marker-end:url(#efa-arrow);
      }
      .title {
        font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
        fill:#0f172a;
        font-size:25px;
        font-weight:bold;
        text-anchor:middle;
      }
      .txt {
        font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
        fill:#334155;
        font-size:21px;
        text-anchor:middle;
      }
      .small {
        font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
        fill:#64748b;
        font-size:17px;
        text-anchor:middle;
      }
      .branch {
        font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
        fill:#0f766e;
        font-size:19px;
        font-weight:bold;
        text-anchor:middle;
      }
      .feedback {
        font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
        fill:#b45309;
        font-size:17px;
        text-anchor:middle;
      }
      .resultText {
        font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
        fill:#065f46;
        font-size:21px;
        font-weight:bold;
        text-anchor:middle;
      }
    </style>
  </defs>

  <!-- 背景 -->
  <rect class="bg" width="1120" height="1200" rx="12"/>

  <text class="title" x="560" y="37">
    探索性因素分析（EFA）流程
  </text>

  <!-- ===================== -->
  <!-- 顶部：提取方法与因子数 -->
  <!-- ===================== -->

  <rect class="start" x="425" y="65"
        width="270" height="80" rx="8"/>
  <text class="txt" x="560" y="98">
    选择因素提取方法
  </text>
  <text class="small" x="560" y="125">
    PAF、PCA 等
  </text>

  <path class="edge" d="M560 145 V187"/>

  <rect class="start" x="410" y="190"
        width="300" height="95" rx="8"/>
  <text class="txt" x="560" y="228">
    确认因素个数并
  </text>
  <text class="txt" x="560" y="260">
    抽取因素（碎石图等）
  </text>

  <!-- ===================== -->
  <!-- 左：单因素路径 -->
  <!-- ===================== -->

  <path class="edge"
        d="M485 285 L292 365"/>

  <rect x="315" y="312" width="95" height="32"
        rx="5" fill="#faf8f2"/>
  <text class="branch" x="362" y="335">
    单因素
  </text>

  <rect class="process" x="150" y="365"
        width="285" height="95" rx="8"/>
  <text class="txt" x="292" y="404">
    检验题目—因素相关
  </text>
  <text class="small" x="292" y="435">
    （因素负荷）
  </text>

  <path class="edge" d="M292 460 V529"/>

  <text class="small" x="398" y="503">
    清晰、简单结构
  </text>

  <ellipse class="result"
           cx="292" cy="595"
           rx="142" ry="62"/>

  <text class="resultText" x="292" y="585">
    结构清晰
  </text>
  <text class="resultText" x="292" y="615">
    单维量表
  </text>

  <!-- 单因素结构模糊：反馈回路 -->
  <path class="return"
        d="M150 411 H113 V248 H410"/>

  <text class="feedback" x="184" y="333">
    结构模糊
  </text>

  <!-- ===================== -->
  <!-- 右：多因素路径 -->
  <!-- ===================== -->

  <path class="edge"
        d="M635 285 L827 365"/>

  <rect x="700" y="312" width="95" height="32"
        rx="5" fill="#faf8f2"/>
  <text class="branch" x="747" y="335">
    多因素
  </text>

  <rect class="process" x="695" y="365"
        width="265" height="95" rx="8"/>

  <text class="txt" x="827" y="420">
    因素旋转
  </text>

  <!-- ===================== -->
  <!-- 正交旋转：左下分支 -->
  <!-- ===================== -->

  <path class="edge"
        d="M765 460 L407 720"/>

  <rect x="513" y="553" width="118" height="34"
        rx="5" fill="#faf8f2"/>
  <text class="branch" x="572" y="577">
    正交旋转
  </text>

  <rect class="process" x="260" y="720"
        width="295" height="95" rx="8"/>

  <text class="txt" x="407" y="758">
    检验题目—因素相关
  </text>
  <text class="small" x="407" y="790">
    （因素负荷）
  </text>

  <path class="edge"
        d="M407 815 V931"/>

  <text class="small" x="308" y="865">
    清晰、简单结构
  </text>

  <ellipse class="result"
           cx="407" cy="1000"
           rx="170" ry="65"/>

  <text class="resultText" x="407" y="976">
    结构清晰
  </text>
  <text class="resultText" x="407" y="1007">
    多维量表
  </text>
  <text class="small" x="407" y="1036">
    维度间不相关
  </text>

  <!-- 正交结构模糊：外侧反馈回路 -->
  <path class="return"
        d="M260 766 H60 V210 H410"/>

  <text class="feedback" x="164" y="744">
    结构模糊
  </text>

  <!-- ===================== -->
  <!-- 斜交旋转：右下分支 -->
  <!-- ===================== -->

  <path class="edge"
        d="M877 460 V720"/>

  <rect x="887" y="556" width="118" height="35"
        rx="5" fill="#faf8f2"/>
  <text class="branch" x="946" y="580">
    斜交旋转
  </text>

  <rect class="process" x="700" y="720"
        width="300" height="95" rx="8"/>

  <text class="txt" x="850" y="758">
    检验题目—因素相关
  </text>
  <text class="small" x="850" y="790">
    （因素负荷）
  </text>

  <path class="edge"
        d="M850 815 V884"/>

  <text class="small" x="954" y="849">
    清晰、简单结构
  </text>

  <rect class="node" x="742" y="887"
        width="216" height="75" rx="8"/>

  <text class="txt" x="850" y="917">
    检验因子间
  </text>
  <text class="txt" x="850" y="946">
    相关程度
  </text>

  <path class="edge"
        d="M850 962 V1005"/>

  <ellipse class="result"
           cx="850" cy="1070"
           rx="166" ry="62"/>

  <text class="resultText" x="850" y="1050">
    结构清晰
  </text>
  <text class="resultText" x="850" y="1080">
    多维量表
  </text>
  <text class="small" x="850" y="1107">
    维度间相关
  </text>

  <!-- 斜交结构模糊：右侧反馈回路 -->
  <path class="return"
        d="M1000 766 H1060 V237 H710"/>

  <rect x="952" y="646" width="98" height="31"
        rx="5" fill="#faf8f2"/>

  <text class="feedback" x="1001" y="668">
    结构模糊
  </text>

  <!-- 图注 -->
  <text class="small" x="560" y="1168">
    图 4-5　探索性因素分析流程（根据原书重绘）
  </text>

</svg>